name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
    paths-ignore: ["**.md", "**.adoc"]
  pull_request:
    branches: ["**"]
    paths-ignore: ["**.md", "**.adoc"]
  workflow_dispatch:

jobs:
  build-flatpak:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64

    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Configure Flathub remote
        run: |
          flatpak remote-add --if-not-exists --user flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak remotes --user

      - name: Build Flatpak bundle
        run: |
          flatpak-builder --disable-rofiles-fuse --force-clean --user \
            --default-branch=stable \
            --install-deps-from=flathub \
            --repo=flatpak-repo \
            build-dir tools/flatpak/shanti-ibus.yml
          flatpak build-bundle --arch=${{ matrix.arch }} \
            flatpak-repo shanti-ibus-${{ matrix.arch }}.flatpak \
            org.shanti.ShantiIbus stable

      - name: Smoke test Flatpak bundle
        run: |
          flatpak install --user --noninteractive --assumeyes \
            ./shanti-ibus-${{ matrix.arch }}.flatpak

          metadata="$(flatpak info --user --show-metadata org.shanti.ShantiIbus)"
          grep -Fq 'name=org.shanti.ShantiIbus' <<<"$metadata"
          grep -Fq 'runtime=org.gnome.Platform/' <<<"$metadata"

          flatpak run --user --env=GTK_A11Y=none \
            org.shanti.ShantiIbus --version
          flatpak run --user --env=GTK_A11Y=none \
            org.shanti.ShantiIbus --check-data

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v5
        with:
          name: shanti-ibus-flatpak-${{ matrix.arch }}
          path: shanti-ibus-${{ matrix.arch }}.flatpak
          if-no-files-found: error

  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            rustc \
            cargo \
            libzstd-dev \
            libibus-1.0-dev \
            ca-certificates

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_IBUS=ON

      - name: Build
        run: cmake --build build --parallel 2
